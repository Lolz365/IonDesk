[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "visualops-worker"
version = "0.1.0"
description = "VisualOps background worker foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "celery[redis]==5.6.3",
  "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "kombu"]
ignore_missing_imports = true
disallow_untyped_calls = false
