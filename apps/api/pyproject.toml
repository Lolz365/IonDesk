[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "visualops-api"
version = "0.1.0"
description = "VisualOps enterprise API foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg==0.31.0",
  "boto3==1.43.97",
  "fastapi==0.141.1",
  "PyJWT[crypto]==2.10.1",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx==0.28.1",
  "mypy==1.17.1",
  "openapi-spec-validator==0.7.2",
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgresql: requires an explicit disposable VISUALOPS_TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "boto3", "redis.*"]
ignore_missing_imports = true
disallow_untyped_calls = false
